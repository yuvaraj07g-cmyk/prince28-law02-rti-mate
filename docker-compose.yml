# One command for the whole stack:  docker compose up --build
# Local development only: these passwords never leave your laptop.
name: rti_mate

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app  # pragma: allowlist secret
      POSTGRES_DB: app
    ports:
      - "5433:5432"  # 5433 on your laptop, so it never clashes with another Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine  # used from Week 2 for job queues and caching
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:  # runs once: migrations + seed data, then exits
    build: .
    command: ["sh", "-c", "alembic upgrade head && python scripts/load_db.py"]
    environment: &app-env
      REDIS_URL: redis://redis:6379
      APP_ENV: local
      DATABASE_URL: postgresql://app:app@db:5432/app  # pragma: allowlist secret
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: *app-env
    env_file: &keys  # your model keys; the values above win over the ones in .env
      - path: .env
        required: false

    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:  # the same image as the api, started with a different command
    build: .
    command: ["arq", "rti_mate.workers.main.WorkerSettings"]
    environment: *app-env
    env_file: *keys
    volumes:
      - ./data/raw:/app/data/raw:ro  # your downloaded files; without them it downloads again
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
