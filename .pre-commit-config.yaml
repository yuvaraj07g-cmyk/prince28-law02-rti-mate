# Runs on every "git commit". If a hook fails, the commit is stopped.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # the download logbook is text we choose to version, even when it grows
        exclude: (^|.*/)data/manifest\.jsonl$
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # uv.lock hashes, Alembic revision ids and file fingerprints look random but are not secrets
        exclude: ^(uv\.lock|migrations/versions/.*|(.*/)?data/manifest\.jsonl)$
