# CI: every pull request and every push to main.
# lint -> unit + integration tests (real Postgres) -> build the image -> push it (main only)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:  # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    services:
      postgres:  # same image as docker compose: dev = CI
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app  # pragma: allowlist secret
          POSTGRES_DB: app
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://app:app@localhost:5433/app  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe lint
      - name: Unit + integration tests with coverage
        run: uv run poe cov

  image:
    name: build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}  # PRs only prove the image builds
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
